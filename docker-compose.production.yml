services:
  db:
    image: postgres:15
    container_name: postgres-prod
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  sportfinder-app:
    build: .
    container_name: sportfinder-app
    depends_on:
      - db
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    networks:
      - web

volumes:
  postgres_data:

networks:
  web:
    external: true
